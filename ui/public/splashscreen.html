<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Bead Game</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1f2a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      flex-direction: column;
      gap: 32px;
      color: #f0e8df;
    }
    .title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .status {
      font-size: 14px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(240, 232, 223, 0.3);
      border-top-color: #d97a4f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="title">The Glass Bead Game</div>
  <div class="status">
    <div class="spinner"></div>
    Starting Holochain&hellip;
  </div>
</body>
</html>
