[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace]
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.dependencies]
# Exact pins: these crates are hashed into the integrity wasm, so a rebuild against a
# different hdi/hdk would change the DNA hash. Never relax to a caret on a frozen line.
hdi = "=0.8.0"
hdk = "=0.7.0"
serde = "1"
holochain_serialized_bytes = "=0.0.57"

[workspace.dependencies.glassbeadgame]
path = "dnas/glassbeadgame/zomes/coordinator/glassbeadgame"

[workspace.dependencies.glassbeadgame_integrity]
path = "dnas/glassbeadgame/zomes/integrity/glassbeadgame"

[workspace.dependencies.profiles]
path = "dnas/glassbeadgame/zomes/coordinator/profiles"

[workspace.dependencies.profiles_integrity]
path = "dnas/glassbeadgame/zomes/integrity/profiles"
